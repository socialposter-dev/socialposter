name: Feature Request
description: Suggest an improvement to the core desktop app
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Description
      description: Describe the core app feature you would like to see. (New social network integrations should be built as Wasm plugins via socialposter-dev/plugin-starter.)
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
    validations:
      required: false