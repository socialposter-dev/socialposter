name: Bug Report
description: Report a bug in the SocialPoster desktop app
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App Version & OS
      placeholder: e.g. v1.0.0 on Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Related Plugin (if applicable)
      placeholder: e.g. Discord v1.0.1, or None
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See error...
    validations:
      required: true